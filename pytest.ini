[pytest]
# Run from the repo root: pytest  or  pytest -m time_intensive
testpaths = webserver/tests tools/tests
pythonpath = webserver tools .
# importlib mode lets the two same-named `tests` packages (webserver/tests and
# tools/tests) be collected together without a module-name collision.
addopts = -m "not time_intensive" --import-mode=importlib
markers =
    time_intensive: slow tests (full-resolution dither runs); enable with `pytest -m time_intensive`
