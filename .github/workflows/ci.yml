name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-firmware:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B firmware/test/host/build firmware/test/host

      - name: Build
        run: cmake --build firmware/test/host/build

      - name: Run tests
        run: ctest --test-dir firmware/test/host/build --output-on-failure

  test-webserver:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e "webserver/[test]"

      - name: Run tests
        run: pytest webserver/tests -m "not time_intensive"

  test-tools:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # Running on Linux is itself the Blocker-B regression test: the installer
      # tooling must import with no ctypes.wintypes. esp-idf-nvs-partition-gen
      # gives the NVS generator with no ESP-IDF (Blocker A).
      - name: Install dependencies
        run: pip install pyserial esptool esp-idf-nvs-partition-gen tzdata pytest

      - name: Run tools tests
        run: pytest tools/tests

  lint-firmware:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install cppcheck
        run: sudo apt-get install -y --no-install-recommends cppcheck

      - name: Run cppcheck
        run: >
          cppcheck
          --enable=all
          --std=c11
          --suppress=missingIncludeSystem
          --suppress=missingInclude
          --suppress=checkersReport
          --inline-suppr
          --error-exitcode=1
          firmware/main/

  build-firmware:
    needs: [test-firmware, lint-firmware]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3
          target: esp32s3
          path: firmware
          command: bash ci-build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: hokku-firmware
          path: firmware/release/hokku-firmware_*.bin

  build-webserver-deb:
    needs: test-webserver
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper dh-python python3-setuptools pybuild-plugin-pyproject

      - name: Build .deb
        working-directory: webserver
        run: dpkg-buildpackage -us -uc -b

      - name: Collect artifacts
        run: |
          mkdir -p build
          mv hokku-server_*.deb hokku-server_*.buildinfo hokku-server_*.changes build/

      - uses: actions/upload-artifact@v7
        with:
          name: hokku-server-deb
          path: build/hokku-server_*.deb
